<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title description">
<title id="title">EduVision — a frame, explained</title>
<desc id="description">An illustrated classroom frame becomes a person crop. Pose landmarks and a phone outline appear, then saved crops and a schematic plot. This is an explanation of the research workflow, not recorded model output. Reduced motion shows the completed illustration.</desc>
